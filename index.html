<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMC · Saúde Clara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f4f7f6;
            --surface: #ffffff;
            --text: #1a2e2b;
            --text-soft: #5a6e6a;
            --border: #e0e8e6;
            --accent: #0d9488;
            --accent-soft: #ccfbf1;
            --accent-dark: #0f766e;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #16a34a;
            --radius: 16px;
            --shadow: 0 4px 20px rgba(13, 148, 136, 0.08);
            --font: 'Plus Jakarta Sans', system-ui, sans-serif;
        }

        [data-theme="dark"] {
            --bg: #0f1c1a;
            --surface: #1a2e2b;
            --text: #e8f0ee;
            --text-soft: #94a8a4;
            --border: #2a403c;
            --accent: #2dd4bf;
            --accent-soft: #134e4a;
            --accent-dark: #5eead4;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.5;
            transition: background 0.35s ease, color 0.35s ease;
        }

        .app {
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.25rem 3rem;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: var(--accent);
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .logo h1 {
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .logo span {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-soft);
            margin-top: -2px;
        }

        .theme-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: grid;
            place-items: center;
            font-size: 1.15rem;
            transition: all 0.2s;
            box-shadow: var(--shadow);
        }

        .theme-btn:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
        }

        /* Layout principal */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        /* Cards */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            transition: background 0.35s, border-color 0.35s;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* Inputs */
        .field {
            margin-bottom: 1.1rem;
        }

        .field label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text);
        }

        .field input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: var(--font);
            font-size: 1rem;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .field input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .field input::placeholder {
            color: var(--text-soft);
            opacity: 0.7;
        }

        /* Botão principal */
        .btn-primary {
            width: 100%;
            padding: 0.95rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.25);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Medidor circular */
        .gauge-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0 0.5rem;
        }

        .gauge {
            position: relative;
            width: 200px;
            height: 200px;
        }

        .gauge svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .gauge-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 12;
        }

        .gauge-fill {
            fill: none;
            stroke: var(--accent);
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 502.65;
            stroke-dashoffset: 502.65;
            transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s;
        }

        .gauge-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .gauge-value {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
        }

        .gauge-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-soft);
            margin-top: 0.25rem;
        }

        /* Resultado */
        .result-box {
            margin-top: 1.25rem;
            padding: 1rem 1.25rem;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .result-class {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .result-risk {
            font-size: 0.85rem;
            color: var(--text-soft);
            margin-bottom: 0.6rem;
        }

        .result-tip {
            font-size: 0.9rem;
            color: var(--text);
            background: var(--accent-soft);
            padding: 0.6rem 0.9rem;
            border-radius: 10px;
            display: inline-block;
        }

        /* Histórico */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .btn-clear {
            background: none;
            border: none;
            color: var(--text-soft);
            font-family: var(--font);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .btn-clear:hover {
            color: var(--danger);
            background: rgba(220, 38, 38, 0.08);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 420px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.85rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: border-color 0.2s;
        }

        .history-item:hover {
            border-color: var(--accent);
        }

        .history-bar {
            width: 6px;
            height: 36px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .history-info {
            flex: 1;
            min-width: 0;
        }

        .history-imc {
            font-weight: 700;
            font-size: 1.05rem;
        }

        .history-meta {
            font-size: 0.78rem;
            color: var(--text-soft);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-class {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.55rem;
            border-radius: 20px;
            white-space: nowrap;
        }

        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-soft);
            font-size: 0.95rem;
        }

        .empty-state span {
            display: block;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        /* Cores por classificação */
        .c-baixo {
            color: #ca8a04;
            background: #fef9c3;
        }

        .c-normal {
            color: #15803d;
            background: #dcfce7;
        }

        .c-sobre {
            color: #c2410c;
            background: #ffedd5;
        }

        .c-obeso {
            color: #b91c1c;
            background: #fee2e2;
        }

        [data-theme="dark"] .c-baixo {
            color: #facc15;
            background: #422006;
        }

        [data-theme="dark"] .c-normal {
            color: #4ade80;
            background: #14532d;
        }

        [data-theme="dark"] .c-sobre {
            color: #fb923c;
            background: #431407;
        }

        [data-theme="dark"] .c-obeso {
            color: #f87171;
            background: #450a0a;
        }

        /* Footer */
        footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-soft);
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="logo">
                <div class="logo-icon">IMC</div>
                <div>
                    <h1>Saúde Clara</h1>
                    <span>Calculadora de IMC</span>
                </div>
            </div>
            <button class="theme-btn" id="themeBtn" title="Alternar tema">☾</button>
        </header>

        <div class="grid">
            <!-- Coluna esquerda: formulário + medidor -->
            <div class="card">
                <div class="card-title">Dados</div>

                <div class="field">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" placeholder="Ex: 68.5" step="0.1" min="0" />
                </div>

                <div class="field">
                    <label for="altura">Altura (m)</label>
                    <input type="number" id="altura" placeholder="Ex: 1.72" step="0.01" min="0" />
                </div>

                <button class="btn-primary" id="calcBtn">
                    Calcular IMC
                </button>

                <div class="gauge-wrap">
                    <div class="gauge">
                        <svg viewBox="0 0 180 180">
                            <circle class="gauge-bg" cx="90" cy="90" r="80" />
                            <circle class="gauge-fill" id="gaugeFill" cx="90" cy="90" r="80" />
                        </svg>
                        <div class="gauge-center">
                            <div class="gauge-value" id="gaugeValue">—</div>
                            <div class="gauge-label">IMC</div>
                        </div>
                    </div>
                </div>

                <div class="result-box" id="resultBox">
                    <div class="result-class" id="resultClass">Aguardando dados</div>
                    <div class="result-risk" id="resultRisk"></div>
                    <div class="result-tip" id="resultTip">Preencha peso e altura</div>
                </div>
            </div>

            <!-- Coluna direita: histórico -->
            <div class="card">
                <div class="history-header">
                    <div class="card-title" style="margin:0">Histórico recente</div>
                    <button class="btn-clear" id="clearBtn">Limpar tudo</button>
                </div>

                <div class="history-list" id="historyList">
                    <div class="empty-state">
                        <span>📋</span>
                        Nenhum cálculo ainda
                    </div>
                </div>
            </div>
        </div>

        <footer>
            Classificação segundo a OMS · Dados salvos localmente no seu navegador
        </footer>
    </div>

    <script>
        (function () {
            'use strict';

            const CIRCUMFERENCE = 2 * Math.PI * 80; // 502.65

            const pesoEl = document.getElementById('peso');
            const alturaEl = document.getElementById('altura');
            const calcBtn = document.getElementById('calcBtn');
            const clearBtn = document.getElementById('clearBtn');
            const themeBtn = document.getElementById('themeBtn');
            const gaugeFill = document.getElementById('gaugeFill');
            const gaugeValue = document.getElementById('gaugeValue');
            const resultClass = document.getElementById('resultClass');
            const resultRisk = document.getElementById('resultRisk');
            const resultTip = document.getElementById('resultTip');
            const historyList = document.getElementById('historyList');

            // ========== Histórico ==========
            function getHist() {
                try {
                    return JSON.parse(localStorage.getItem('imcSaudeClara') || '[]');
                } catch {
                    return [];
                }
            }

            function saveHist(arr) {
                localStorage.setItem('imcSaudeClara', JSON.stringify(arr));
            }

            // ========== Classificação ==========
            function classificar(imc, peso, altura) {
                if (imc < 18.5) {
                    const falta = (18.5 * altura * altura - peso).toFixed(1);
                    return {
                        nome: 'Abaixo do peso',
                        risco: 'Risco baixo',
                        tip: `Ganhe cerca de ${falta} kg para atingir a faixa normal. Consulte um nutricionista.`,
                        cor: '#ca8a04',
                        classe: 'c-baixo',
                        pct: 0.25
                    };
                }
                if (imc < 25) {
                    return {
                        nome: 'Peso normal',
                        risco: 'Risco mínimo',
                        tip: 'Ótimo! Mantenha hábitos saudáveis de alimentação e movimento.',
                        cor: '#16a34a',
                        classe: 'c-normal',
                        pct: 0.45
                    };
                }
                if (imc < 30) {
                    const perda = (peso - 24.9 * altura * altura).toFixed(1);
                    return {
                        nome: 'Sobrepeso',
                        risco: 'Risco elevado',
                        tip: `Perda sugerida de cerca de ${perda} kg. Atividade física + reeducação alimentar ajudam.`,
                        cor: '#d97706',
                        classe: 'c-sobre',
                        pct: 0.65
                    };
                }
                if (imc < 35) {
                    const perda = (peso - 24.9 * altura * altura).toFixed(1);
                    return {
                        nome: 'Obesidade grau I',
                        risco: 'Risco médio',
                        tip: `Procure orientação profissional. Perder ${perda} kg já faria diferença.`,
                        cor: '#dc2626',
                        classe: 'c-obeso',
                        pct: 0.78
                    };
                }
                if (imc < 40) {
                    return {
                        nome: 'Obesidade grau II',
                        risco: 'Risco alto',
                        tip: 'Busque acompanhamento médico o quanto antes.',
                        cor: '#b91c1c',
                        classe: 'c-obeso',
                        pct: 0.88
                    };
                }
                return {
                    nome: 'Obesidade grau III',
                    risco: 'Risco muito alto',
                    tip: 'Procure um especialista imediatamente.',
                    cor: '#7f1d1d',
                    classe: 'c-obeso',
                    pct: 0.97
                };
            }

            // ========== Atualizar medidor ==========
            function atualizarGauge(imc, info) {
                if (imc === null) {
                    gaugeFill.style.strokeDashoffset = CIRCUMFERENCE;
                    gaugeFill.style.stroke = 'var(--accent)';
                    gaugeValue.textContent = '—';
                    return;
                }

                const pct = Math.min(1, Math.max(0, info.pct));
                const offset = CIRCUMFERENCE * (1 - pct);
                gaugeFill.style.strokeDashoffset = offset;
                gaugeFill.style.stroke = info.cor;
                gaugeValue.textContent = imc.toFixed(1);
            }

            // ========== Calcular ==========
            function calcular() {
                const peso = parseFloat(pesoEl.value);
                const altura = parseFloat(alturaEl.value);

                if (isNaN(peso) || isNaN(altura) || peso <= 0 || altura <= 0) {
                    atualizarGauge(null);
                    resultClass.textContent = 'Valores inválidos';
                    resultRisk.textContent = '';
                    resultTip.textContent = 'Use apenas números positivos';
                    return;
                }

                const imc = peso / (altura * altura);
                const info = classificar(imc, peso, altura);

                atualizarGauge(imc, info);
                resultClass.textContent = info.nome;
                resultRisk.textContent = info.risco;
                resultTip.textContent = info.tip;

                // Salvar
                const hist = getHist();
                hist.push({
                    data: new Date().toLocaleString('pt-BR', {
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    }),
                    peso,
                    altura,
                    imc: parseFloat(imc.toFixed(2)),
                    classificacao: info.nome,
                    classe: info.classe,
                    cor: info.cor
                });

                if (hist.length > 40) hist.shift();
                saveHist(hist);
                renderHistorico();
            }

            // ========== Renderizar histórico ==========
            function renderHistorico() {
                const hist = getHist();
                historyList.innerHTML = '';

                if (hist.length === 0) {
                    historyList.innerHTML = `
            <div class="empty-state">
              <span>📋</span>
              Nenhum cálculo ainda
            </div>`;
                    return;
                }

                // Mais recentes primeiro
                const recentes = [...hist].reverse().slice(0, 15);

                recentes.forEach(reg => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
            <div class="history-bar" style="background:${reg.cor}"></div>
            <div class="history-info">
              <div class="history-imc">${reg.imc.toFixed(1)}</div>
              <div class="history-meta">${reg.data} · ${reg.peso} kg · ${reg.altura} m</div>
            </div>
            <div class="history-class ${reg.classe}">${reg.classificacao}</div>
          `;
                    historyList.appendChild(item);
                });
            }

            // ========== Limpar ==========
            function limpar() {
                if (confirm('Apagar todo o histórico?')) {
                    saveHist([]);
                    renderHistorico();
                    atualizarGauge(null);
                    resultClass.textContent = 'Histórico limpo';
                    resultRisk.textContent = '';
                    resultTip.textContent = 'Calcule novamente para ver resultados';
                }
            }

            // ========== Tema ==========
            function toggleTheme() {
                const html = document.documentElement;
                const isDark = html.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    html.removeAttribute('data-theme');
                    themeBtn.textContent = '☾';
                    localStorage.setItem('imcTheme', 'light');
                } else {
                    html.setAttribute('data-theme', 'dark');
                    themeBtn.textContent = '☀';
                    localStorage.setItem('imcTheme', 'dark');
                }
            }

            // ========== Init ==========
            function init() {
                // Restaurar tema
                if (localStorage.getItem('imcTheme') === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    themeBtn.textContent = '☀';
                }

                atualizarGauge(null);
                renderHistorico();

                calcBtn.addEventListener('click', calcular);
                clearBtn.addEventListener('click', limpar);
                themeBtn.addEventListener('click', toggleTheme);

                pesoEl.addEventListener('keypress', e => { if (e.key === 'Enter') calcular(); });
                alturaEl.addEventListener('keypress', e => { if (e.key === 'Enter') calcular(); });
            }

            init();
        })();
    </script>
</body>

</html>
